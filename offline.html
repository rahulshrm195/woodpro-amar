<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoodPro — offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F5F2;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:#1C1917;padding:24px}
  .box{text-align:center;max-width:320px}
  img{width:72px;height:72px;border-radius:18px;margin-bottom:20px}
  h1{font-size:19px;margin:0 0 8px;font-weight:650}
  p{font-size:14px;line-height:1.55;color:#78716C;margin:0 0 20px}
  button{background:#EF7F1A;color:#fff;border:0;border-radius:10px;padding:12px 22px;
         font-size:15px;font-weight:600;font-family:inherit}
</style>
</head>
<body>
  <div class="box">
    <img src="./icons/icon-192x192.png" alt="">
    <h1>No connection</h1>
    <p>WoodPro couldn't load this screen. Sheets and quotes you've already opened stay available once the app is running.</p>
    <button onclick="location.replace('./index.html')">Try again</button>
  </div>
</body>
</html>
